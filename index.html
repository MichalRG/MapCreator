<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Creator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">MC</span>
          <div class="brand-copy">
            <h1>Map Creator</h1>
            <p>Switch between grid cartography and freeform cave drafting.</p>
          </div>
        </div>

        <label class="mode-switch">
          <span>Editor mode</span>
          <select id="editor-mode-select">
            <option value="grid">Grid Maps + Grid Caves</option>
            <option value="freeform-cave">Freeform Cave Draft</option>
          </select>
        </label>
      </header>

      <main class="mode-stage">
        <section id="grid-mode-root" class="mode-pane"></section>
        <section id="freeform-mode-root" class="mode-pane hidden"></section>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
